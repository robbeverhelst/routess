# GDAL OSM driver config for the node-network tile build (ADR 0033).
# Exposes the node-network tags as feature attributes so transform.ts does not
# have to lean on other_tags. Anything not listed still arrives via other_tags.

[general]
attribute_name_laundering=no

[points]
osm_id=yes
attributes=name,ref,network,rwn_ref,lwn_ref,rcn_ref,lcn_ref
other_tags=yes

[lines]
osm_id=yes
attributes=name,ref,network
other_tags=yes

# Route relations (network:type=node_network, network=lcn/rcn/lwn/rwn) are
# assembled here. We read these for the connection lines between numbered nodes.
[multipolygons]
osm_id=yes
attributes=name,type
other_tags=yes

[multilinestrings]
osm_id=yes
attributes=name,type,ref,network
other_tags=yes
