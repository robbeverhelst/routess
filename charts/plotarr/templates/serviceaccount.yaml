{{- if .Values.serviceAccount.web.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plotarr.web.serviceAccountName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "plotarr.web.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.web.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.web.automountServiceAccountToken | default false }}
{{- end }}
---
{{- if .Values.serviceAccount.api.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plotarr.api.serviceAccountName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "plotarr.api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.api.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.api.automountServiceAccountToken | default false }}
{{- end }}
