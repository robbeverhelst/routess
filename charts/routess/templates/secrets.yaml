apiVersion: v1
kind: Secret
metadata:
  name: {{ include "routess.fullname" . }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "routess.api.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.api.secrets.jwtSecret | quote }}
  google-client-id: {{ .Values.api.secrets.googleClientId | quote }}
  google-client-secret: {{ .Values.api.secrets.googleClientSecret | quote }}
  db-host: {{ .Values.api.secrets.dbHost | quote }}
  db-user: {{ .Values.api.secrets.dbUser | quote }}
  db-password: {{ .Values.api.secrets.dbPassword | quote }}
  db-port: {{ .Values.api.env.dbPort | quote }}
  db-name: {{ .Values.api.env.dbName | quote }}
  analytics-salt: {{ .Values.api.secrets.analyticsSalt | quote }}
  pat-pepper: {{ .Values.api.secrets.patPepper | quote }}
  resend-api-key: {{ .Values.api.secrets.resendApiKey | quote }}
