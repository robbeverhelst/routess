{{- if .Values.monitoring.prometheusRule.enabled }}
{{- $t := .Values.monitoring.prometheusRule.thresholds }}
{{- $job := printf "%s-api" (include "routess.fullname" .) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "routess.fullname" . }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "routess.api.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: routess-api
      rules:
        - alert: RoutessApiDown
          expr: max(up{job="{{ $job }}"}) == 0 or absent(up{job="{{ $job }}"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "routess API is down"
            description: "No API target has been scrapeable for 5 minutes."
        - alert: RoutessApiHighErrorRate
          expr: |
            sum(rate(http_request_errors_total{status_code=~"5.."}[5m]))
              / sum(rate(http_requests_total[5m])) * 100 > {{ $t.errorRatePercent }}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "routess API 5xx error rate above {{ $t.errorRatePercent }}%"
            description: "{{`{{ $value | printf \"%.1f\" }}`}}% of requests returned 5xx over the last 5 minutes."
        - alert: RoutessApiHighLatency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_ms_bucket[5m])))
              > {{ $t.latencyP95Ms }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "routess API p95 latency above {{ $t.latencyP95Ms }}ms"
            description: "p95 request latency is {{`{{ $value | printf \"%.0f\" }}`}}ms over the last 5 minutes."
        - alert: RoutessAuthFailureSpike
          expr: sum(increase(auth_login_total{result!="success"}[5m])) > {{ $t.authFailuresPer5m }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Spike in failed logins"
            description: "{{`{{ $value | printf \"%.0f\" }}`}} failed login attempts in the last 5 minutes."
        - alert: RoutessExternalProviderErrors
          expr: |
            sum by (provider) (rate(external_request_duration_ms_count{status="error"}[10m]))
              / sum by (provider) (rate(external_request_duration_ms_count[10m])) * 100
              > {{ $t.providerErrorRatePercent }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "External provider {{`{{ $labels.provider }}`}} failing"
            description: "{{`{{ $value | printf \"%.1f\" }}`}}% of requests to {{`{{ $labels.provider }}`}} failed over the last 10 minutes."
        - alert: RoutessDbHighLatency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(db_query_duration_ms_bucket[5m])))
              > {{ $t.dbLatencyP95Ms }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Database p95 query latency above {{ $t.dbLatencyP95Ms }}ms"
            description: "p95 DB query latency is {{`{{ $value | printf \"%.0f\" }}`}}ms over the last 5 minutes."
        {{- if $t.cacheHitRatePercent }}
        - alert: RoutessCacheHitRateLow
          # Per-cache hit rate, only evaluated once a cache sees real traffic
          # (the right-hand sample-rate clause) so cold starts stay quiet.
          expr: |
            (
              sum by (cache) (rate(cache_events_total{result="hit"}[10m]))
                / sum by (cache) (rate(cache_events_total[10m])) * 100
                < {{ $t.cacheHitRatePercent }}
            )
            and
            (
              sum by (cache) (rate(cache_events_total[10m])) > {{ $t.cacheMinSampleRps }}
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Cache {{`{{ $labels.cache }}`}} hit rate below {{ $t.cacheHitRatePercent }}%"
            description: "{{`{{ $labels.cache }}`}} hit rate is {{`{{ $value | printf \"%.0f\" }}`}}% over 10m. Expected high once warm; check Redis and TTLs (ADR 0032)."
        {{- end }}
        {{- if $t.cacheMinSampleRps }}
        - alert: RoutessCacheBackendDegraded
          # Cache traffic exists but zero hits across all caches: Redis is
          # almost certainly unreachable and the API is failing open to misses
          # (provider spend rises, quotas stop enforcing).
          expr: |
            sum(rate(cache_events_total{result="hit"}[5m])) == 0
            and sum(rate(cache_events_total[5m])) > {{ $t.cacheMinSampleRps }}
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Cache backend degraded (zero hits under load)"
            description: "No cache hits while caches are being queried. Redis is likely down; the API is failing open. Check the redis pod and REDIS_URL."
        {{- end }}
        {{- if $t.providerCallRatePerSec }}
        - alert: RoutessProviderCallRateHigh
          # provider_calls_total counts only uncached upstream calls, so a
          # sustained high rate after warm-up means the cache is being bypassed
          # or spend is genuinely climbing.
          expr: sum(rate(provider_calls_total[10m])) > {{ $t.providerCallRatePerSec }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Provider call rate above {{ $t.providerCallRatePerSec }}/s"
            description: "Uncached provider calls are running at {{`{{ $value | printf \"%.1f\" }}`}}/s over 10m. Caches should keep this low; check hit rates and cost."
        {{- end }}
        {{- if $t.quota429sPer5m }}
        - alert: RoutessQuota429Spike
          expr: sum(increase(http_request_errors_total{status_code="429"}[5m])) > {{ $t.quota429sPer5m }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Spike in 429 responses"
            description: "{{`{{ $value | printf \"%.0f\" }}`}} rate-limit/quota rejections in 5m. Either abuse, or a quota/throttle is too tight (GENERATION_QUOTA_PER_DAY)."
        {{- end }}
        - alert: RoutessApiOOMKilled
          # The signal that actually survives the failure. Every app-level alert
          # above is computed from metrics the API exports, so an OOM kill
          # erases its own evidence: the process dies mid-request, no 5xx is
          # ever recorded, and the histogram is never scraped. This reads
          # kube-state-metrics instead. The last-terminated reason latches for
          # the life of the pod, so it is gated on a restart having actually
          # happened in the window; without that it would fire forever.
          expr: |
            sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace="{{ .Values.global.namespace }}",container="api"}[15m])) > 0
            and on (pod) max by (pod) (
              kube_pod_container_status_last_terminated_reason{namespace="{{ .Values.global.namespace }}",container="api",reason="OOMKilled"}
            ) == 1
          labels:
            severity: critical
          annotations:
            summary: "routess API pod was OOM-killed"
            description: "{{`{{ $labels.pod }}`}} hit its memory limit and was killed. In-flight requests were dropped without a 5xx being recorded, so the app-level alerts stay silent."
        {{- if $t.restartsPer6h }}
        - alert: RoutessApiRestartingRepeatedly
          # The chronic-pattern alert. A single restart is noise; a handful in a
          # day is a bug that is already costing users. This is the one that
          # would have surfaced #354 weeks before it became an outage.
          expr: |
            sum by (container) (increase(kube_pod_container_status_restarts_total{namespace="{{ .Values.global.namespace }}",container="api"}[6h]))
              >= {{ $t.restartsPer6h }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "routess API restarted {{ $t.restartsPer6h }}+ times in 6h"
            description: "{{`{{ $value | printf \"%.0f\" }}`}} API container restarts in the last 6 hours. Check `kubectl -n {{ .Values.global.namespace }} describe pod` for the termination reason."
        {{- end }}
        {{- if $t.memoryLimitFraction }}
        - alert: RoutessApiMemoryNearLimit
          # Early warning, best-effort by construction. max_over_time does the
          # smoothing rather than `for:`, because the spike that motivated this
          # showed up in exactly one 30s scrape out of 4434 on the incident day.
          # Putting the window in `for:` instead would make this never fire.
          # Joins take max() on both sides so a duplicate kube-state-metrics
          # series (seen after a KSM restart) cannot break the rule.
          expr: |
            max_over_time((
              max by (namespace,pod,container) (
                container_memory_working_set_bytes{namespace="{{ .Values.global.namespace }}",container="api"}
              )
              / on (namespace,pod,container) group_left max by (namespace,pod,container) (
                kube_pod_container_resource_limits{namespace="{{ .Values.global.namespace }}",container="api",resource="memory"}
              )
            )[5m:30s]) > {{ $t.memoryLimitFraction }}
          labels:
            severity: warning
          annotations:
            summary: "routess API memory above {{ $t.memoryLimitFraction }} of its limit"
            description: "{{`{{ $labels.pod }}`}} reached {{`{{ $value | humanizePercentage }}`}} of its memory limit in the last 5 minutes. An OOM kill is imminent or already happened."
        {{- end }}
        {{- with .Values.monitoring.prometheusRule.additionalRules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
