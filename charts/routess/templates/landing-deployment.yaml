apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "routess.fullname" . }}-landing
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "routess.landing.labels" . | nindent 4 }}
spec:
  {{- if not .Values.landing.autoscaling.enabled }}
  replicas: {{ .Values.landing.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "routess.landing.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "routess.landing.selectorLabels" . | nindent 8 }}
        {{- with .Values.landing.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.landing.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "routess.landing.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.landing.automountServiceAccountToken | default false }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.landing.securityContext | nindent 8 }}
      containers:
        - name: landing
          image: "{{ .Values.landing.image.repository }}:{{ .Values.landing.image.tag }}"
          imagePullPolicy: {{ .Values.landing.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.landing.service.targetPort }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.landing.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.landing.resources | nindent 12 }}
          {{- with .Values.landing.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.landing.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.landing.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.landing.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.landing.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.landing.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.landing.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
