{{- if .Values.web.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "routess.fullname" . }}-web
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "routess.web.labels" . | nindent 4 }}
spec:
  {{- if .Values.web.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.web.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.web.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "routess.web.selectorLabels" . | nindent 6 }}
{{- end }}
---
{{- if .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "routess.fullname" . }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "routess.api.labels" . | nindent 4 }}
spec:
  {{- if .Values.api.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.api.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.api.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "routess.api.selectorLabels" . | nindent 6 }}
{{- end }}
---
{{- if and .Values.landing .Values.landing.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "routess.fullname" . }}-landing
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "routess.landing.labels" . | nindent 4 }}
spec:
  {{- if .Values.landing.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.landing.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.landing.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.landing.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "routess.landing.selectorLabels" . | nindent 6 }}
{{- end }}
