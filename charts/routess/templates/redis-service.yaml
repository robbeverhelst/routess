{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "routess.fullname" . }}-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "routess.redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "routess.redis.selectorLabels" . | nindent 4 }}
{{- end }}
