{{- if and .Values.nodeTiles.enabled (not .Values.nodeTiles.s3.existingSecret) }}
# S3 credentials for the node-tiles upload (ADR 0033). Provide your own secret
# via nodeTiles.s3.existingSecret to keep keys out of values entirely.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "routess.fullname" . }}-node-tiles
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "routess.nodeTiles.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "nodeTiles.s3.accessKeyId is required when enabled and no existingSecret" .Values.nodeTiles.s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "nodeTiles.s3.secretAccessKey is required when enabled and no existingSecret" .Values.nodeTiles.s3.secretAccessKey | quote }}
{{- end }}
