apiVersion: v1
kind: Service
metadata:
  name: {{ include "routess.fullname" . }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "routess.api.labels" . | nindent 4 }}
  {{- if or .Values.api.service.annotations .Values.monitoring.serviceMonitor.scrapeAnnotations }}
  annotations:
    {{- if .Values.monitoring.serviceMonitor.scrapeAnnotations }}
    prometheus.io/scrape: "true"
    prometheus.io/path: {{ .Values.monitoring.serviceMonitor.path | quote }}
    prometheus.io/port: {{ .Values.api.service.port | quote }}
    {{- end }}
    {{- with .Values.api.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
  {{- if eq .Values.api.service.type "LoadBalancer" }}
  {{- with .Values.api.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.api.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.api.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- end }}
  selector:
    {{- include "routess.api.selectorLabels" . | nindent 4 }}
