{{- if .Values.api.seedRefresh.enabled }}
# Scheduled ExternalRoute refresh (ADR 0035): re-pulls green SeedSources with
# a stable feedUrl that are due per their refreshIntervalDays. Idempotent, so
# an extra or overlapping run is harmless. Manual sources are skipped.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "routess.fullname" . }}-seed-refresh
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "routess.api.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.api.seedRefresh.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "routess.api.selectorLabels" . | nindent 12 }}
            routess.app/job: seed-refresh
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "routess.api.serviceAccountName" . }}
          automountServiceAccountToken: false
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          containers:
            - name: seed-refresh
              image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
              imagePullPolicy: {{ .Values.api.image.pullPolicy }}
              # Production image ships dist only; run the compiled script.
              command: ["bun", "dist/scripts/refresh-seeds.js"]
              # Same env as the api Deployment: the script boots the full
              # AppModule and validates the same production config.
              env:
                {{- include "routess.api.env" . | nindent 16 }}
              securityContext:
                {{- toYaml .Values.api.containerSecurityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.api.seedRefresh.resources | nindent 16 }}
{{- end }}
