apiVersion: v1
kind: Service
metadata:
  name: {{ include "routess.fullname" . }}-landing
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "routess.landing.labels" . | nindent 4 }}
spec:
  type: {{ .Values.landing.service.type }}
  ports:
    - port: {{ .Values.landing.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "routess.landing.selectorLabels" . | nindent 4 }}
