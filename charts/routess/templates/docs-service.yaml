apiVersion: v1
kind: Service
metadata:
  name: {{ include "routess.fullname" . }}-docs
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "routess.docs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.docs.service.type }}
  ports:
    - port: {{ .Values.docs.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "routess.docs.selectorLabels" . | nindent 4 }}
