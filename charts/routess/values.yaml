    # route page's og.png proxy, read by the Next server at request time.
    # Leave empty to fall back to the baked static preview image.
    MAPBOX_PUBLIC_TOKEN: ""
    # Server-side API base for public route pages and the sitemap. Set to the
    # in-cluster service URL to skip the public hop; empty falls back to
    # https://api.routess.com.
    API_URL: ""
    # Browser-facing API base rendered into hrefs (GPX download). Empty falls
    # back to https://api.routess.com.
    PUBLIC_API_URL: ""
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    capabilities:
      drop: [ALL]
  automountServiceAccountToken: false
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

