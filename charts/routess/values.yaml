ingress:
  enabled: true
  className: cloudflare-tunnel
  web:
    hosts:
      - app.routess.com
    tls: []
    #  - secretName: routess-app-tls
    #    hosts:
    #      - app.routess.com
    annotations: {}
  api:
    hosts:
      - api.routess.com
    tls: []
    annotations: {}
  docs:
    hosts:
      - docs.routess.com
    tls: []
    annotations: {}
  # Landing has multiple hosts (one per ccTLD): apex + www for each.
  # Locale is resolved by the landing app from the Host header at request time
  # (routess.com -> en, routess.be -> nl). One image, two ingress targets.
  landing:
    hosts:
      - routess.com
      - www.routess.com
      - routess.be
      - www.routess.be
    tls: []
    annotations: {}

networkPolicies:
  enabled: true
  cloudflareNamespace: cloudflare
  postgresEgress:
    enabled: true
    host: ""  # set via --set from 1Password
    port: 5432

monitoring:
  serviceMonitor:
    # When true, renders a Prometheus Operator ServiceMonitor for the API.
    # Requires the monitoring.coreos.com CRDs in the cluster.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    # Extra labels to match your Prometheus Operator's serviceMonitorSelector.
    labels: {}
    relabelings: []
    metricRelabelings: []
    # When true, also adds prometheus.io/scrape annotations to the API Service
    # for clusters using annotation-based scrape discovery (no Operator).
    scrapeAnnotations: false
  prometheusRule:
    # When true, renders a PrometheusRule with alerts for the critical
    # failure modes: API down, 5xx rate, latency, auth failures, external
    # provider errors, DB latency, and the caching/provider-cost signals
    # (cache hit rate, provider call spend, Redis reachability). Requires the
    # Prometheus Operator CRDs.
    enabled: false
    # Extra labels to match your Prometheus Operator's ruleSelector.
    labels: {}
    thresholds:
      # Alert when more than this % of requests return 5xx (5m window).
      errorRatePercent: 5
      # Alert when p95 request latency exceeds this (ms, 10m sustained).
      latencyP95Ms: 1500
      # Alert when failed logins in a 5m window exceed this count.
      authFailuresPer5m: 10
      # Alert when more than this % of requests to a provider fail (10m window).
      providerErrorRatePercent: 20
      # Alert when p95 DB query latency exceeds this (ms, 10m sustained).
      dbLatencyP95Ms: 250
      # Caching / provider-cost alerts (ADR 0032). Set any to 0 to disable
      # just that alert.
      # Warn when a cache's hit rate falls below this % once it has warmed
      # (evaluated only above cacheMinSampleRps to avoid noise at low traffic).
      cacheHitRatePercent: 60
      # Minimum cache lookups/sec before the hit-rate alert is considered.
      cacheMinSampleRps: 0.1
      # Warn when total paid-provider calls/sec stay above this (caches should
      # keep this low once warm). Tune to your real baseline.
      providerCallRatePerSec: 5
      # Warn when daily-quota 429s exceed this count in 5m (abuse or too-tight
      # a quota).
      quota429sPer5m: 20
    # Extra rule entries appended verbatim to the routess-api group.
    additionalRules: []
  # Optional Grafana dashboard URLs surfaced in the admin UI's system panel.
  grafanaUrls:
    apiOverview: ""
    apiLatency: ""
    runtime: ""

imagePullSecrets: []
# - name: ghcr-secret

