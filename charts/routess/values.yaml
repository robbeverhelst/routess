global:
  namespace: routess
  createNamespace: true
  # Shared Umami analytics for web, landing, and docs (one website ID across all
  # hostnames). Leave empty to disable. The Umami website must accept every
  # hostname (routess.com, routess.be, app.routess.com, docs.routess.com).
  umami:
    url: ""
    websiteId: ""

web:
  replicaCount: 2
  image:
    repository: ghcr.io/robbeverhelst/routess-web
    tag: latest
    pullPolicy: IfNotPresent
  env:
    VITE_MAPBOX_ACCESS_TOKEN: ""
    VITE_GOOGLE_CLIENT_ID: ""
    VITE_APP_URL: "https://app.routess.com"
    VITE_API_URL: "https://api.routess.com"
    # Origin that serves the canonical public route page (the landing host, e.g.
    # https://routess.com). Empty falls back to the app origin. See ADR 0025.
    VITE_PUBLIC_ROUTE_BASE_URL: "https://routess.com"
    VITE_APP_VERSION: ""
    # Sentry/GlitchTip error reporting. Leave VITE_SENTRY_DSN empty to disable.
    VITE_SENTRY_DSN: ""
    VITE_SENTRY_ENVIRONMENT: "production"
    VITE_SENTRY_TRACES_SAMPLE_RATE: "0.1"
    VITE_SENTRY_LOGS_ENABLED: "false"
    VITE_SENTRY_DEBUG: "false"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
    # nodePort: 30080  # only used when type is NodePort
    # annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    capabilities:
      drop: [ALL]
  automountServiceAccountToken: false
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    # maxUnavailable: 1

api:
  replicaCount: 2
  image:
    repository: ghcr.io/robbeverhelst/routess-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    # nodePort: 30300  # only used when type is NodePort
    # annotations: {}
  env:
    nodeEnv: production
    port: "3000"
    dbPort: "5432"
    dbName: routess
    # Interactive API docs stay on in production: the API surface is public
    # anyway (open-source repo + published OpenAPI spec), so hiding the UI
    # buys nothing. Set to "false" to trim the swagger-ui JS surface.
    swaggerEnabled: "true"
    swaggerPath: "/api"
    # From address for transactional email. Must be a verified Resend sender.
    emailFrom: "routess <noreply@routess.app>"
    # Canonical public-site origin (landing host). Emails embed
    # {publicSiteUrl}/r/{slugId}/og.png as the route preview image.
    publicSiteUrl: "https://routess.com"
    # Base URL of a Valhalla routing service for surface breakdowns. Leave
    # empty to disable the trace-attributes proxy (the web app falls back
    # gracefully and just skips surface strips). Set to any reachable URL,
    # e.g. an in-cluster Service like
    # `http://valhalla.valhalla.svc.cluster.local:8002`, an ingress, or a
    # Tailscale hostname.
    valhallaUrl: ""
    # Mapbox public token for server-side reverse geocoding (Place derivation,
    # CONTEXT.md "Place"). Public pk token, URL-restricted; the API sends the
    # referer below with each request. Leave empty to disable derivation
    # (Places stay null until the backfill runs with a token).
    mapboxPublicToken: ""
    geocodingReferer: "https://routess.com"
  # Email allowlist for admin role. Source of truth for User.role; reconciled at
  # login via AuthService. Empty list disables reconciliation entirely (existing
  # roles are preserved). See ADR-0015.
  adminEmails: []
  #   - admin@example.com
  secrets:
    # These are set via --set in CI from 1Password
    jwtSecret: ""
    googleClientId: ""
    googleClientSecret: ""
    dbHost: ""
    dbUser: ""
    dbPassword: ""
    analyticsSalt: ""
    # Server-side pepper used to HMAC personal access tokens. Required when
    # NODE_ENV=production; the API refuses to start without it.
    patPepper: ""
    # Empty disables Resend; the API falls back to a console transport (dev-only).
    resendApiKey: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  automountServiceAccountToken: false
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    # maxUnavailable: 1

landing:
  replicaCount: 2
  image:
    repository: ghcr.io/robbeverhelst/routess-landing
    tag: latest
    pullPolicy: IfNotPresent
  env:
    # Public (pk.*) Mapbox token for the live mini-planner map and the public
    # route page's og.png proxy, read by the Next server at request time.
    # Leave empty to fall back to the baked static preview image.
    MAPBOX_PUBLIC_TOKEN: ""
    # Server-side API base for public route pages and the sitemap. Set to the
    # in-cluster service URL to skip the public hop; empty falls back to
    # https://api.routess.com.
    API_URL: ""
    # Browser-facing API base rendered into hrefs (GPX download). Empty falls
    # back to https://api.routess.com.
    PUBLIC_API_URL: ""
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    capabilities:
      drop: [ALL]
  automountServiceAccountToken: false
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

docs:
  replicaCount: 1
  image:
    repository: ghcr.io/robbeverhelst/routess-docs
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    capabilities:
      drop: [ALL]
  automountServiceAccountToken: false
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

ingress:
  enabled: true
  className: cloudflare-tunnel
  web:
    hosts:
      - app.routess.com
    tls: []
    #  - secretName: routess-app-tls
    #    hosts:
    #      - app.routess.com
    annotations: {}
  api:
    hosts:
      - api.routess.com
    tls: []
    annotations: {}
  docs:
    hosts:
      - docs.routess.com
    tls: []
    annotations: {}
  # Landing has multiple hosts (one per ccTLD): apex + www for each.
  # Locale is resolved by the landing app from the Host header at request time
  # (routess.com -> en, routess.be -> nl). One image, two ingress targets.
  landing:
    hosts:
      - routess.com
      - www.routess.com
      - routess.be
      - www.routess.be
    tls: []
    annotations: {}

networkPolicies:
  enabled: true
  cloudflareNamespace: cloudflare
  postgresEgress:
    enabled: true
    host: ""  # set via --set from 1Password
    port: 5432

monitoring:
  serviceMonitor:
    # When true, renders a Prometheus Operator ServiceMonitor for the API.
    # Requires the monitoring.coreos.com CRDs in the cluster.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    # Extra labels to match your Prometheus Operator's serviceMonitorSelector.
    labels: {}
    relabelings: []
    metricRelabelings: []
    # When true, also adds prometheus.io/scrape annotations to the API Service
    # for clusters using annotation-based scrape discovery (no Operator).
    scrapeAnnotations: false
  # Optional Grafana dashboard URLs surfaced in the admin UI's system panel.
  grafanaUrls:
    apiOverview: ""
    apiLatency: ""
    runtime: ""

imagePullSecrets: []
# - name: ghcr-secret

serviceAccount:
  web:
    create: true
    annotations: {}
  api:
    create: true
    annotations: {}
  docs:
    create: true
    annotations: {}
  landing:
    create: true
    annotations: {}
