global:
  namespace: routess
  createNamespace: true
  # Shared Umami analytics for web, landing, and docs (one website ID across all
  # hostnames). Leave empty to disable. The Umami website must accept every
  # hostname (routess.com, routess.be, app.routess.com, docs.routess.com).
  umami:
    url: ""
    websiteId: ""

web:
  replicaCount: 2
  image:
    repository: ghcr.io/robbeverhelst/routess-web
    tag: latest
    pullPolicy: IfNotPresent
  env:
    VITE_MAPBOX_ACCESS_TOKEN: ""
    VITE_GOOGLE_CLIENT_ID: ""
    VITE_APP_URL: "https://app.routess.com"
    VITE_API_URL: "https://api.routess.com"
    # TileJSON URL of the node-network tiles (ADR 0033), served by go-pmtiles
    # from the .pmtiles file, e.g. https://tiles.routess.com/nodes.json. Empty
    # disables the overlay. Do NOT point this at the raw .pmtiles file:
    # mapbox-gl's native pmtiles provider throws "a is not defined" under
    # terrain/globe. The TileJSON's tiles[] serve standard MVT, which renders
    # like the basemap (terrain-safe).
    VITE_NODE_TILES_URL: ""
    # Origin that serves the canonical public route page (the landing host, e.g.
    # https://routess.com). Empty falls back to the app origin. See ADR 0025.
    VITE_PUBLIC_ROUTE_BASE_URL: "https://routess.com"
    VITE_APP_VERSION: ""
    # Sentry/GlitchTip error reporting. Leave VITE_SENTRY_DSN empty to disable.
    VITE_SENTRY_DSN: ""
    VITE_SENTRY_ENVIRONMENT: "production"
    VITE_SENTRY_TRACES_SAMPLE_RATE: "0.1"
    VITE_SENTRY_LOGS_ENABLED: "false"
    VITE_SENTRY_DEBUG: "false"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
    # nodePort: 30080  # only used when type is NodePort
    # annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    capabilities:
      drop: [ALL]
  automountServiceAccountToken: false
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    # maxUnavailable: 1

api:
  replicaCount: 2
  image:
    repository: ghcr.io/robbeverhelst/routess-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    # nodePort: 30300  # only used when type is NodePort
    # annotations: {}
  env:
    nodeEnv: production
    port: "3000"
    dbPort: "5432"
    dbName: routess
    # App version stamped into logs and metrics. Empty falls back to the
    # image tag, which CI sets to the release version.
    appVersion: ""
    # Interactive API docs stay on in production: the API surface is public
    # anyway (open-source repo + published OpenAPI spec), so hiding the UI
    # buys nothing. Set to "false" to trim the swagger-ui JS surface.
    swaggerEnabled: "true"
    swaggerPath: "/api"
    # From address for transactional email. Must be a verified Resend sender.
    emailFrom: "routess <noreply@routess.app>"
    # Canonical public-site origin (landing host). Emails embed
    # {publicSiteUrl}/r/{slugId}/og.png as the route preview image.
    publicSiteUrl: "https://routess.com"
    # Base URL of a Valhalla routing service for surface breakdowns. Leave
    # empty to disable the trace-attributes proxy (the web app falls back
    # gracefully and just skips surface strips). Set to any reachable URL,
    # e.g. an in-cluster Service like
    # `http://valhalla.valhalla.svc.cluster.local:8002`, an ingress, or a
    # Tailscale hostname.
    valhallaUrl: ""
    # TileJSON URL of the node-network tiles served by go-pmtiles (ADR
    # 0033/0037), e.g. https://tiles.routess.com/nodes.json. The generation
    # pipeline derives knooppunt anchor pools from it; usually the same URL
    # as the web app's VITE_NODE_TILES_URL. Empty disables knooppunt mode.
    nodeTilesUrl: ""
    # Mapbox public token for server-side reverse geocoding (Place derivation,
    # CONTEXT.md "Place"). Public pk token, URL-restricted; the API sends the
    # referer below with each request. Leave empty to disable derivation
    # (Places stay null until the backfill runs with a token).
    mapboxPublicToken: ""
    geocodingReferer: "https://routess.com"
    # Per-User daily cap on RouteGeneration attempts (each fans out into many
    # paid Valhalla calls). Empty uses the API default (50); "0" disables.
    generationQuotaPerDay: ""
  # Scheduled ExternalRoute refresh (ADR 0035). Pulls green SeedSources with
  # a stable feedUrl when due per their refreshIntervalDays; idempotent.
  seedRefresh:
    enabled: true
    # Weekly, Monday 04:15 UTC. Sources gate themselves on refreshIntervalDays,
    # so a frequent schedule only re-pulls what is actually due.
    schedule: "15 4 * * 1"
    # The refresh boots the full AppModule and holds many sources' geometry in
    # memory while parsing (EuroVelo's 17 feeds, OSM Belgium's ~3k relations),
    # so it needs far more headroom than the API server. 512Mi OOM-killed it.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
  # Email allowlist for admin role. Source of truth for User.role; reconciled at
  # login via AuthService. Empty list disables reconciliation entirely (existing
  # roles are preserved). See ADR-0015.
  adminEmails: []
  #   - admin@example.com
  secrets:
    # These are set via --set in CI from 1Password
    jwtSecret: ""
    googleClientId: ""
    googleClientSecret: ""
    dbHost: ""
    dbUser: ""
    dbPassword: ""
    analyticsSalt: ""
    # Server-side pepper used to HMAC personal access tokens. Required when
    # NODE_ENV=production; the API refuses to start without it.
    patPepper: ""
    # Empty disables Resend; the API falls back to a console transport (dev-only).
    resendApiKey: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  automountServiceAccountToken: false
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    # maxUnavailable: 1

redis:
  # Single-instance, cache-only Redis (ADR 0032): shared provider-response
  # caches, throttler storage, and daily quota counters. No persistence and no
  # HA on purpose; losing it only costs warm caches. Disable to fall back to
  # per-pod in-memory caching (halved hit rates, per-pod throttle buckets).
  enabled: true
  image:
    repository: redis
    tag: 8-alpine
    pullPolicy: IfNotPresent
  # Eviction keeps the instance bounded; every entry is reconstructible.
  maxmemory: 128mb
  maxmemoryPolicy: allkeys-lru
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 192Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true

nodeTiles:
  # Monthly OSM -> PMTiles build for the node-network overlay (ADR 0033).
  # Disabled by default: enable once an object-storage bucket exists and the
  # web app's VITE_NODE_TILES_URL points at the uploaded file.
  enabled: false
  image:
    repository: ghcr.io/robbeverhelst/routess-node-tiles
    tag: latest
    pullPolicy: IfNotPresent
  # 03:00 UTC on the 1st of each month. Node networks change slowly.
  schedule: "0 3 1 * *"
  # Space-separated Geofabrik .osm.pbf extracts. Geofabrik no longer offers a
  # combined "benelux" file, so Benelux is assembled from the three per-country
  # extracts. Trim to a single country to shrink the build (Netherlands has the
  # densest network, Belgium is smallest), or add europe-latest.osm.pbf to widen.
  geofabrikUrl: "https://download.geofabrik.de/europe/belgium-latest.osm.pbf https://download.geofabrik.de/europe/netherlands-latest.osm.pbf https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf"
  minZoom: 8
  maxZoom: 14
  # Hard ceiling so a stuck download/build cannot run forever (3h).
  activeDeadlineSeconds: 10800
  # Scratch space for the build, sized for the Benelux extract: the raw .osm.pbf
  # is ~1.5GB and everything after osmium filtering is small, so peak is ~2-4GB.
  # For a Europe extract (~28GB raw) raise this and the ephemeral-storage limit
  # to ~40Gi.
  workSizeLimit: 8Gi
  s3:
    # S3-compatible endpoint (MinIO, R2, ...), bucket, and object key the web
    # app reads. The object must be public-read with CORS allowing the web
    # origin and Range requests (CORS lives in the infra repo).
    endpoint: ""
    bucket: ""
    objectKey: "nodes.pmtiles"
    acl: "public-read"
    cacheControl: "public, max-age=86400"
    region: ""
    # Credentials: either inline here, or reference an existing secret holding
    # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (preferred).
    existingSecret: ""
    accessKeyId: ""
    secretAccessKey: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 8Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: [ALL]
    # gdal/tippecanoe write scratch under /tmp (an emptyDir); root stays clean
    # but is not forced read-only to avoid tool-specific temp surprises.
    readOnlyRootFilesystem: false

landing:
  replicaCount: 2
  image:
    repository: ghcr.io/robbeverhelst/routess-landing
    tag: latest
    pullPolicy: IfNotPresent
  env:
