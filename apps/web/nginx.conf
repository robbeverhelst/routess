# Security: Rate limiting zones
limit_req_zone $binary_remote_addr zone=main:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;

server {
    listen 8080;
    server_name localhost;

    # Security: Hide nginx version
    server_tokens off;

    # Security: Buffer overflow protection
    client_body_buffer_size 1K;
    client_header_buffer_size 1k;
    client_max_body_size 1k;
    large_client_header_buffers 2 1k;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://api.mapbox.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.mapbox.com https://events.mapbox.com https://maps-api.robbeverhelst.com wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self';" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;

    location / {
        # Security: Apply rate limiting
        limit_req zone=main burst=20 nodelay;
        
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets with rate limiting
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        # Security: Apply static rate limiting
        limit_req zone=static burst=50 nodelay;
        
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Disable caching for service worker
    location = /service-worker.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Security: Block common exploit attempts
    location ~* \.(php|asp|aspx|jsp)$ {
        deny all;
    }

    # Security: Block hidden files
    location ~ /\. {
        deny all;
    }

    # Security: Block backup files
    location ~* \.(bak|backup|old|orig|tmp)$ {
        deny all;
    }
} 