server {
    listen 8080;
    server_name localhost;

    include /etc/nginx/snippets/security-headers.conf;

    # Same-origin tunnel for Sentry/GlitchTip envelopes. The file is written
    # by entrypoint.sh only when VITE_SENTRY_DSN is set; absent otherwise so
    # POST /__t 404s when GlitchTip is not configured (ADR-0021).
    include /etc/nginx/snippets/tunnel.conf;

    # Never cache the service worker — it must be re-checked on every load
    # so new versions get installed promptly.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Never cache the entry HTML — its <script>/<link> tags reference
    # content-hashed assets, so a stale index.html pins the user to an old build.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Never cache the runtime env-config — entrypoint.sh rewrites it on every
    # container start, so a cached copy pins users to the env vars from the
    # previous deploy. Exact-match wins over the .js regex location below.
    location = /env-config.js {
        include /etc/nginx/snippets/security-headers.conf;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Cache hashed static assets aggressively — filenames change between builds.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        include /etc/nginx/snippets/security-headers.conf;
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
