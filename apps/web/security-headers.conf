# Security headers for every response. Kept in a snippet because nginx's
# add_header inheritance is all-or-nothing: a location with its own
# add_header drops everything from the server block, so each location
# includes this explicitly.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# frame-ancestors-only CSP: blocks clickjacking without constraining
# scripts/styles. The full allowlist policy is generated at container start
# by entrypoint.sh into csp.conf as Content-Security-Policy-Report-Only,
# with a report-uri/report-to pointing at the same-origin /__csp sink; flip
# it to enforcing there once the collected reports show nothing genuine.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
include /etc/nginx/snippets/csp.conf;
