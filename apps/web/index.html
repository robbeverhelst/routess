<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>routess</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <meta name="background-color" content="#ffffff" />
    <meta
      name="description"
      content="Plan cycling and walking routes with waypoints, import/export GPX files, and navigate offline"
    />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />

    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="routess" />

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Additional PWA Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="routess" />

    <!-- Umami analytics. Loader skips itself when env vars are missing or unsubstituted. -->
    <script>
      (() => {
        const url = "%VITE_UMAMI_URL%";
        const id = "%VITE_UMAMI_WEBSITE_ID%";
        const unresolved = (v) => !v || v.indexOf("%VITE_") === 0 || v.indexOf("__VITE_") === 0;
        if (unresolved(url) || unresolved(id)) return;
        const s = document.createElement("script");
        s.defer = true;
        s.src = `${url.replace(/\/$/, "")}/script.js`;
        s.setAttribute("data-website-id", id);
        document.head.appendChild(s);
      })();
    </script>

    <!-- Redesign fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />

    <!-- Mapbox: warm DNS/TLS before Mapbox GL JS initializes. -->
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link rel="preconnect" href="https://events.mapbox.com" crossorigin />

    <!-- Apply persisted dark theme synchronously to avoid a light->dark flash on cold load. -->
    <script>
      (() => {
        try {
          const raw = localStorage.getItem("routess-redesign-ui");
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (parsed?.state && parsed.state.theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (_) {
          /* ignore — fall back to default light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
