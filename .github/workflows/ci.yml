name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"

env:
  REGISTRY: ghcr.io
  CHART_NAME: routess

jobs:
  test:
    runs-on: arc-routess
    timeout-minutes: 15
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: routess_db_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install

      - name: Format & lint
        run: bunx biome check .

      - name: Type-check
        run: bun run --filter '*' check-types

      - name: Test
        run: bun run --filter './apps/api' --filter './apps/web' --filter './packages/*' test

      - name: Build
        run: bun run --filter './packages/*' build && bun run --filter './apps/*' build

  helm-validate:
    runs-on: arc-routess
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Lint Helm chart
        run: helm lint ./charts/routess

      - name: Template Helm chart
        run: |
          helm template test-release ./charts/routess \
            --set api.secrets.jwtSecret=test \
            --set api.secrets.googleClientId=test \
            --set api.secrets.dbHost=10.0.0.1 \
            --set api.secrets.dbUser=test \
            --set api.secrets.dbPassword=test > /dev/null
          echo "Helm template rendering successful"

  release:
    needs:
      - test
      - helm-validate
    runs-on: arc-routess
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      released: ${{ steps.release-meta.outputs.released }}
      version: ${{ steps.release-meta.outputs.version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: bun install

      - name: Capture current release tag
        id: previous-tag
        run: |
          TAG=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory /home/runner/_work/maps/maps
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          bunx semantic-release

      - name: Detect released version
        id: release-meta
        run: |
          git fetch --force --tags origin
          LATEST_TAG=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          PREVIOUS_TAG='${{ steps.previous-tag.outputs.tag }}'

          if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "$PREVIOUS_TAG" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  publish-images:
    needs: release
    runs-on: arc-routess
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: docs
            dockerfile: apps/docs/Dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive image tags
        id: version
        run: |
          VERSION='${{ needs.release.outputs.version }}'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/routess-${{ matrix.app }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-helm:
    needs:
      - release
      - publish-images
    runs-on: arc-routess
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Update Chart version
        run: |
          VERSION='${{ needs.release.outputs.version }}'
          sed -i "s/^version:.*/version: $VERSION/" charts/routess/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" charts/routess/Chart.yaml

      - name: Package Helm chart
        run: helm package charts/routess

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        run: |
          helm push ${{ env.CHART_NAME }}-${{ needs.release.outputs.version }}.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Attach chart to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.version }}
          files: |
            ${{ env.CHART_NAME }}-${{ needs.release.outputs.version }}.tgz
          fail_on_unmatched_files: true
