name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"

env:
  REGISTRY: ghcr.io
  CHART_NAME: routess

jobs:
  test:
    runs-on: arc-routess
    timeout-minutes: 15
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: routess_db_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Format & lint
        run: bunx biome check .

      - name: Build packages
        run: bun run --filter './packages/*' build

      - name: Type-check
        run: bun run --filter '*' check-types

      - name: Test
        run: bun run --filter './apps/api' --filter './apps/web' --filter './packages/*' test

      - name: Build apps
        run: bun run --filter './apps/*' build

  helm-validate:
    runs-on: arc-routess
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Lint Helm chart
        run: helm lint ./charts/routess

      - name: Template Helm chart
        run: |
          helm template test-release ./charts/routess \
            --set api.secrets.jwtSecret=test \
            --set api.secrets.googleClientId=test \
            --set api.secrets.dbHost=10.0.0.1 \
            --set api.secrets.dbUser=test \
            --set api.secrets.dbPassword=test > /dev/null
          echo "Helm template rendering successful"

  release:
    needs:
      - test
      - helm-validate
    runs-on: arc-routess
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      released: ${{ steps.release-meta.outputs.released }}
      version: ${{ steps.release-meta.outputs.version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: bun install

      - name: Capture current release tag
        id: previous-tag
        run: |
          TAG=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory /home/runner/_work/maps/maps
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          bunx semantic-release

      - name: Detect released version
        id: release-meta
        run: |
          git fetch --force --tags origin
          LATEST_TAG=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          PREVIOUS_TAG='${{ steps.previous-tag.outputs.tag }}'

          if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "$PREVIOUS_TAG" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  publish-images:
    needs: release
    runs-on: arc-routess
    if: needs.release.outputs.released == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute deps hash
        id: deps
        run: |
          DEPS_HASH=$(sha256sum bun.lock | cut -c1-12)
          DEPS_IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/routess-deps:${DEPS_HASH}"
          echo "deps_hash=$DEPS_HASH" >> "$GITHUB_OUTPUT"
          echo "deps_image=$DEPS_IMAGE" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$DEPS_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push deps image
        if: steps.deps.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.deps
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.deps.outputs.deps_image }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/routess-deps:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/routess-deps:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/routess-deps:cache,mode=max

      - name: Derive image tags
        id: version
        run: |
          VERSION='${{ needs.release.outputs.version }}'
          SHA='${{ github.sha }}'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Pulls source-map upload creds from 1Password into the job env. The
      # auth token is forwarded to buildx via the secret mount in
      # docker-bake.hcl and never enters image layers.
      - name: Load Sentry secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SENTRY_AUTH_TOKEN: op://Homelab/ccxjg33ok7cmvue2q6x3rrkfwu/auth-token
          SENTRY_ORG: op://Homelab/ccxjg33ok7cmvue2q6x3rrkfwu/org
          SENTRY_PROJECT: op://Homelab/ccxjg33ok7cmvue2q6x3rrkfwu/project
          SENTRY_URL: op://Homelab/ccxjg33ok7cmvue2q6x3rrkfwu/url

      - name: Bake and push images
        env:
          DEPS_IMAGE: ${{ steps.deps.outputs.deps_image }}
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
          MAJOR: ${{ steps.version.outputs.major }}
          SHA: ${{ steps.version.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
          REGISTRY: ${{ env.REGISTRY }}
          # Pinning the build-time version makes the Sentry source-map
          # release match the runtime release reported by env-config.js.
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        working-directory: docker
        run: docker buildx bake --allow=fs.read=.. --push default

  publish-cli:
    needs: release
    # npm registry rejects provenance attestations from self-hosted runners
    # ("Only github-hosted runners are supported when publishing with
    # provenance"). The job is light enough that hosted runners are fine.
    runs-on: ubuntu-latest
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run --filter './packages/*' build

      - name: Build CLI
        run: bun run --filter=routess build

      - name: Prepare CLI package.json for npm
        working-directory: apps/cli
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            // Bun build inlines every dependency into dist/index.js, so the
            // published tarball has no runtime deps. Strip dev/workspace deps
            // before npm sees them to avoid EUNSUPPORTEDPROTOCOL on workspace:.
            delete pkg.devDependencies;
            delete pkg.dependencies;
            delete pkg.scripts;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Load npm token from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NODE_AUTH_TOKEN: op://Homelab/mpeqmgofuv57ilqpfukqocotk4/password

      - name: Publish CLI to npm
        working-directory: apps/cli
        run: npm publish --access public --provenance

  publish-helm:
    needs:
      - release
      - publish-images
    runs-on: arc-routess
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Update Chart version
        run: |
          VERSION='${{ needs.release.outputs.version }}'
          sed -i "s/^version:.*/version: $VERSION/" charts/routess/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" charts/routess/Chart.yaml

      - name: Package Helm chart
        run: helm package charts/routess

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        run: |
          helm push ${{ env.CHART_NAME }}-${{ needs.release.outputs.version }}.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Attach chart to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.version }}
          files: |
            ${{ env.CHART_NAME }}-${{ needs.release.outputs.version }}.tgz
          fail_on_unmatched_files: true
