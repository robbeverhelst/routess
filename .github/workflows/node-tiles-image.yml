name: node-tiles image

# Publishes the node-network tile build image (ADR 0033) independently of the
# app release pipeline. It is a heavy, rarely-changing image (compiles
# tippecanoe from source) and must not block app image publishing, so it is not
# part of the release bake. Runs manually, or automatically when its own files
# change on main. Tagged latest + sha; the CronJob references :latest.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile.node-tiles"
      - "scripts/node-tiles/**"
      - ".github/workflows/node-tiles-image.yml"

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: arc-routess
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake and push node-tiles
        env:
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          REGISTRY: ${{ env.REGISTRY }}
        working-directory: docker
        run: docker buildx bake --allow=fs.read=.. --push node-tiles
