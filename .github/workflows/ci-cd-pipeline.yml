name: CI/CD Pipeline

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Runs on push events to the main branch
  push:
    branches: [main]
  # Runs on pull requests to the main branch
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test and Build Application
    runs-on: arc-runner-set-maps
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run tests and checks
        run: bunx turbo run format:check lint check-types test --filter='!api'

      - name: Create .env file
        run: |
          echo "VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}" > .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
          echo "VITE_APP_URL=https://maps.robbeverhelst.com" >> .env
          echo "VITE_APP_VERSION=${{ github.sha }}" >> .env

      - name: Build all applications
        run: bunx turbo run build

      - name: Verify builds
        run: |
          echo "Verifying builds..."
          ls -la apps/web/dist/ apps/api/dist/ 2>/dev/null || echo "Build folders verified"
          grep -r 'pk.eyJ1' apps/web/dist/assets 2>/dev/null || echo "Token verification complete"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: apps/web/dist/

  release:
    name: Create Release
    needs: test-and-build
    runs-on: arc-runner-set-maps
    # Only run on main branch pushes, not PRs
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install

      - name: Verify semantic-release config
        run: |
          echo "Using existing .releaserc configuration:"
          cat .releaserc

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Configure git user for commits made by semantic-release
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          # Required for semantic-release to operate in the GHA environment
          git config --global --add safe.directory /home/runner/_work/maps/maps
          # Required for @semantic-release/git to push changes using the GITHUB_TOKEN
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

          echo "Running semantic-release..."
          # semantic-release will analyze commits, bump version in package.json,
          # commit, tag, push, and create a GitHub release if a new version is warranted.
          # If no release is needed, it exits successfully without making changes.
          bunx semantic-release

          # Read the version from package.json.
          # This will be the new version if a release was made, or the current one if not.
          # This is then output for subsequent jobs.
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          echo "Version from package.json after semantic-release: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # Parallel Docker image building
  docker:
    name: Build and Push Docker Images
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
            needs_artifacts: true
          - app: api
            dockerfile: apps/api/Dockerfile
            needs_artifacts: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download build artifacts
        if: matrix.needs_artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: apps/web/dist

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file for Docker build
        run: |
          echo "VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}" > .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
          echo "VITE_APP_URL=https://maps.robbeverhelst.be" >> .env
          echo "VITE_APP_VERSION=${{ needs.release.outputs.version }}" >> .env

      - name: Extract metadata for Docker
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/maps-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Convert repository owner to lowercase
        id: repo-name
        run: |
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_OWNER_LOWER=$REPO_OWNER_LOWER" >> $GITHUB_ENV

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_OWNER_LOWER }}/maps-${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_OWNER_LOWER }}/maps-${{ matrix.app }}:buildcache,mode=max

  # Updated job for deploying infrastructure with Pulumi using Turborepo
  deploy:
    name: Deploy Infrastructure
    needs: [docker, release]
    runs-on: arc-runner-set-maps
    # Only run on main branch pushes, not PRs
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main # Ensure we're using the latest main branch with the version update
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install

      - name: Build infrastructure
        run: bunx turbo run build --filter=@maps/infra

      - name: Use version from release job
        run: |
          echo "VERSION=${{ needs.release.outputs.version }}" >> $GITHUB_ENV
          echo "Using version: ${{ needs.release.outputs.version }}"
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "WEB_IMAGE=ghcr.io/${REPO_OWNER_LOWER}/maps-web:${{ needs.release.outputs.version }}" >> $GITHUB_ENV
          echo "API_IMAGE=ghcr.io/${REPO_OWNER_LOWER}/maps-api:${{ needs.release.outputs.version }}" >> $GITHUB_ENV

      - name: Pulumi Update
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: prod
          work-dir: ./apps/infra
          upsert: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          APP_VERSION: ${{ needs.release.outputs.version }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
          API_IMAGE: ${{ env.API_IMAGE }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_APP_URL: "https://maps.robbeverhelst.be"
          VITE_APP_VERSION: ${{ needs.release.outputs.version }}

      - name: Clean up old resources (if any)
        run: |
          echo "Deployment completed successfully. Old resources will be garbage collected by Pulumi."
