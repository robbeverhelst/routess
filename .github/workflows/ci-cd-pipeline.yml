name: CI/CD Pipeline

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Runs on push events to the main branch
  push:
    branches: [main]
  # Runs on pull requests to the main branch
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test and Build Application
    runs-on: arc-runner-set-maps
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-deps
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
            
      - name: Fallback if cache fails
        if: steps.cache-deps.outcome == 'failure'
        run: |
          echo "Cache failed or timed out, proceeding without cache"
          echo "This is normal and just means slower dependency install"

      - name: Install dependencies
        run: |
          bun install
          # Clean up Bun cache to prevent bloat
          bun pm cache rm --global || true

      - name: Run format check, lint, and type checks
        run: bunx turbo run format:check lint check-types

      # TODO: Re-enable API tests once PostgreSQL is properly configured
      # - name: Run API tests
      #   working-directory: apps/api
      #   env:
      #     # Database configuration for API tests - using cluster-local PostgreSQL service
      #     DB_HOST: ${{ secrets.DB_HOST }}
      #     DB_PORT: 5432
      #     DB_USER: ${{ secrets.DB_USER }}
      #     DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      #     DB_NAME: maps_db_test
      #     # Other test environment variables
      #     NODE_ENV: test
      #     JWT_SECRET: test-secret-key
      #     GOOGLE_CLIENT_ID: test-google-client-id
      #   run: bun run test

      - name: Run other package tests
        run: bunx turbo run test --filter='!api'

      - name: Upload test coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./apps/api/coverage/lcov.info,./apps/web/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build all applications
        run: bunx turbo run build

      - name: Verify builds
        run: |
          echo "Verifying builds..."
          ls -la apps/web/dist/ apps/api/dist/ 2>/dev/null || echo "Build folders verified"

  release:
    name: Create Release
    needs: test-and-build
    runs-on: arc-runner-set-maps
    # Only run on main branch pushes, not PRs
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install

      - name: Verify semantic-release config
        run: |
          echo "Using existing .releaserc configuration:"
          cat .releaserc

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Configure git user for commits made by semantic-release
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          # Required for semantic-release to operate in the GHA environment
          git config --global --add safe.directory /home/runner/_work/maps/maps
          # Required for @semantic-release/git to push changes using the GITHUB_TOKEN
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

          echo "Running semantic-release..."
          # semantic-release will analyze commits, bump version in package.json,
          # commit, tag, push, and create a GitHub release if a new version is warranted.
          # If no release is needed, it exits successfully without making changes.
          bunx semantic-release

          # Read the version from package.json.
          # This will be the new version if a release was made, or the current one if not.
          # This is then output for subsequent jobs.
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          echo "Version from package.json after semantic-release: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # Parallel Docker image building
  docker:
    name: Build and Push Docker Images
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
            needs_artifacts: true
          - app: api
            dockerfile: apps/api/Dockerfile
            needs_artifacts: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Bun (for web build)
        if: matrix.needs_artifacts
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for web build)
        if: matrix.needs_artifacts
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and build web
        if: matrix.needs_artifacts
        run: |
          bun install
          bunx turbo run build --filter=web

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/maps-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Convert repository owner to lowercase
        id: repo-name
        run: |
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_OWNER_LOWER=$REPO_OWNER_LOWER" >> $GITHUB_ENV

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_OWNER_LOWER }}/maps-${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_OWNER_LOWER }}/maps-${{ matrix.app }}:buildcache,mode=max
          build-args: |
            VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_APP_URL=https://maps.robbeverhelst.com
            VITE_API_URL=https://maps-api.robbeverhelst.com
            VITE_APP_VERSION=${{ needs.release.outputs.version }}

  # Updated job for deploying infrastructure with Pulumi using Turborepo
  deploy:
    name: Deploy Infrastructure
    needs: [docker, release]
    runs-on: arc-runner-set-maps
    # Only run on main branch pushes, not PRs
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main # Ensure we're using the latest main branch with the version update
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install

      - name: Build infrastructure
        run: bunx turbo run build --filter=@maps/infra

      - name: Use version from release job
        run: |
          echo "VERSION=${{ needs.release.outputs.version }}" >> $GITHUB_ENV
          echo "Using version: ${{ needs.release.outputs.version }}"
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "WEB_IMAGE=ghcr.io/${REPO_OWNER_LOWER}/maps-web:${{ needs.release.outputs.version }}" >> $GITHUB_ENV
          echo "API_IMAGE=ghcr.io/${REPO_OWNER_LOWER}/maps-api:${{ needs.release.outputs.version }}" >> $GITHUB_ENV

      - name: Pulumi Refresh
        uses: pulumi/actions@v6
        timeout-minutes: 5
        with:
          command: refresh
          stack-name: prod
          work-dir: ./apps/infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: Pulumi Update
        uses: pulumi/actions@v6
        timeout-minutes: 5
        with:
          command: up
          stack-name: prod
          work-dir: ./apps/infra
          upsert: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          APP_VERSION: ${{ needs.release.outputs.version }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
          API_IMAGE: ${{ env.API_IMAGE }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Web App Environment Variables
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_APP_URL: "https://maps.robbeverhelst.com"
          VITE_API_URL: "https://maps-api.robbeverhelst.com"
          VITE_APP_VERSION: ${{ needs.release.outputs.version }}
          # API Environment Variables
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          FRONTEND_URL: "https://maps.robbeverhelst.com"
          NODE_ENV: "production"

      - name: Clean up old resources (if any)
        run: |
          echo "Deployment completed successfully. Old resources will be garbage collected by Pulumi."

  # Android native build
  android-build:
    name: Build Android App
    needs: release
    runs-on: arc-runner-set-maps
    # Only run on main branch pushes, not PRs
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/native/android/.gradle
            apps/native/android/app/build
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'apps/native/app.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: |
          bun install
          bun pm cache rm --global || true

      - name: Build shared packages
        run: bunx turbo run build --filter='@maps/*' --parallel

      - name: Prebuild Android  
        working-directory: apps/native
        run: |
          # Skip clean to reuse any existing android folder
          bunx expo prebuild --platform android

      - name: Build Android APKs
        working-directory: apps/native/android
        run: |
          chmod +x gradlew
          
          # Configure Gradle for faster builds (enable daemon for faster builds)
          mkdir -p ~/.gradle
          echo "org.gradle.daemon=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=false" >> ~/.gradle/gradle.properties
          echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
          echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties
          
          # Never run clean - always use cache
          echo "Skipping clean to use cached builds..."

          # Build only release APK (debug is unnecessary for deployment)
          ./gradlew assembleRelease \
            --parallel \
            --build-cache \
            --max-workers=2 \
            -x lint \
            -x test \
            -x lintVitalRelease

          # List all APKs
          find app/build/outputs/apk -name "*.apk" -exec sh -c 'echo "$(basename {}) - $(du -h {} | cut -f1)"' \;

      - name: Prepare APKs for Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          # Create release directory
          mkdir -p release-apks

          # Copy and rename release APK only
          if [ -f "apps/native/android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "apps/native/android/app/build/outputs/apk/release/app-release.apk" "release-apks/maps.apk"
            echo "Prepared maps.apk"
          else
            echo "ERROR: Release APK not found!"
            find apps/native/android/app/build/outputs/apk -name "*.apk"
            exit 1
          fi

          ls -la release-apks/

      - name: Upload Release APKs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: release-apks/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: always()
        run: |
          echo "### Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ needs.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### APK Files:" >> $GITHUB_STEP_SUMMARY
          find apps/native/android/app/build/outputs/apk -name "*.apk" -exec sh -c 'echo "- $(basename {}) ($(du -h {} | cut -f1))"' \; >> $GITHUB_STEP_SUMMARY || echo "No APKs found" >> $GITHUB_STEP_SUMMARY

  # Deploy Android app to Google Play Store
  android-deploy:
    name: Deploy to Google Play Store
    needs: [android-build]
    runs-on: arc-runner-set-maps
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Get APK from Build Artifacts
        run: |
          echo "### Android Deploy Placeholder" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK files would be downloaded from build artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Currently using direct file access from android-build job" >> $GITHUB_STEP_SUMMARY

      # TODO: Add Google Play Store deployment
      - name: Deploy to Google Play Store
        run: |
          echo "### Google Play Store Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Google Play Store deployment not configured yet" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Required setup:" >> $GITHUB_STEP_SUMMARY
          echo "1. Create service account in Google Play Console" >> $GITHUB_STEP_SUMMARY
          echo "2. Add GOOGLE_PLAY_SERVICE_ACCOUNT_JSON to GitHub secrets" >> $GITHUB_STEP_SUMMARY
          echo "3. Sign APK with production keystore" >> $GITHUB_STEP_SUMMARY
          echo "4. Use r0adkll/upload-google-play@v1 action" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build artifacts ready for deployment" >> $GITHUB_STEP_SUMMARY

      # Example of what the deployment would look like:
      # - name: Upload to Google Play
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.maps.mobile
      #     releaseFiles: ./apks/app-release.apk
      #     track: internal
      #     status: draft

  # iOS native build
  ios-build:
    name: Build iOS App
    needs: release
    runs-on: macos-latest
    # Only run on main branch pushes, not PRs
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            apps/native/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/native/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        run: |
          bun install
          bun pm cache rm --global || true

      - name: Build shared packages
        run: bunx turbo run build --filter='@maps/*'

      - name: Prebuild iOS
        working-directory: apps/native
        run: |
          bunx expo prebuild --platform ios --clean

      - name: Install iOS dependencies
        working-directory: apps/native/ios
        run: |
          pod install --repo-update
          
          # List generated files to find correct workspace name
          echo "Available workspace directories:"
          ls -la | grep -E "\.xcworkspace$" || echo "No workspace files found"
          
          echo "Available xcodeproj directories:"
          ls -la | grep -E "\.xcodeproj$" || echo "No xcodeproj files found"

      - name: Build iOS App (Simulator)
        working-directory: apps/native/ios
        run: |
          # Find the workspace directory (not files inside it)
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -type d | head -n 1 | sed 's|^\./||')
          
          if [ -z "$WORKSPACE" ]; then
            echo "No workspace found, using xcodeproj"
            PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -n 1 | sed 's|^\./||')
            SCHEME="${PROJECT%.xcodeproj}"
          else
            SCHEME="${WORKSPACE%.xcworkspace}"
          fi
          
          echo "Building with workspace/project: ${WORKSPACE:-$PROJECT}"
          echo "Using scheme: $SCHEME"
          
          # Build for iOS Simulator (no signing required)
          mkdir -p build
          
          if [ -n "$WORKSPACE" ]; then
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
              -derivedDataPath build/DerivedData \
              build
          else
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
              -derivedDataPath build/DerivedData \
              build
          fi

          # Find and copy the .app bundle from DerivedData
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/
            echo "Copied $(basename "$APP_PATH") to build/"
          else
            echo "No .app bundle found, listing build contents:"
            find build -name "*.app" -type d || echo "No .app bundles found"
          fi

          # List build outputs
          ls -la build/

      - name: Prepare iOS App for Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: apps/native/ios
        run: |
          # Create release directory
          mkdir -p ../../release-ios
          
          # Find the .app bundle
          cd build
          APP_BUNDLE=$(ls -1 *.app 2>/dev/null | head -n 1)
          
          if [ -n "$APP_BUNDLE" ]; then
            # Zip the .app bundle for distribution
            zip -r ../../../release-ios/maps-ios-simulator.zip "$APP_BUNDLE"
            echo "Prepared maps-ios-simulator.zip with $APP_BUNDLE"
          else
            echo "No .app bundle found in build directory"
            ls -la
            exit 1
          fi
          
          ls -la ../../../release-ios/

      - name: Upload iOS Build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: release-ios/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: always()
        run: |
          echo "### iOS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ needs.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Platform: iOS Simulator" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: $RUNNER_OS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "apps/native/ios/build/mobile.app/Info.plist" ]; then
            echo "✅ iOS app built successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ iOS app build failed" >> $GITHUB_STEP_SUMMARY
          fi

  # Deploy iOS app to App Store
  ios-deploy:
    name: Deploy to App Store
    needs: [ios-build]
    runs-on: arc-runner-set-maps
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Deploy to App Store
        run: |
          echo "### App Store Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ App Store deployment not configured yet" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Required setup:" >> $GITHUB_STEP_SUMMARY
          echo "1. macOS runner with Xcode" >> $GITHUB_STEP_SUMMARY
          echo "2. Apple Developer account ($99/year)" >> $GITHUB_STEP_SUMMARY
          echo "3. App Store Connect API Key" >> $GITHUB_STEP_SUMMARY
          echo "4. Provisioning profiles and certificates" >> $GITHUB_STEP_SUMMARY
          echo "5. Use Apple-Actions/upload-testflight-build@v1" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build artifacts ready for deployment" >> $GITHUB_STEP_SUMMARY

      # Example of what the deployment would look like:
      # - name: Upload to TestFlight
      #   uses: Apple-Actions/upload-testflight-build@v1
      #   with:
      #     app-path: ./ios-build/Maps.ipa
