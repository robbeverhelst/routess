name: CI/CD Pipeline

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Runs on push events to the main branch
  push:
    branches: [ main ]
  # Runs on pull requests to the main branch
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Application
    runs-on: arc-runner-set-maps
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Run tests
        run: bun test || echo "No tests configured yet"

  build:
    name: Build Application
    needs: test
    runs-on: arc-runner-set-maps
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Check for Mapbox Token availability
        run: |
          echo "VITE_MAPBOX_ACCESS_TOKEN secret is present: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN != '' }}"

      - name: Build application
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
        run: bun vite build
        
      - name: Verify token in built files
        run: |
          echo "Listing JS files in dist/assets:"
          ls -l dist/assets/*.js || echo "No JS files found in dist/assets"
          echo "Grepping for Mapbox token prefix 'pk.eyJ1' in JS files..."
          grep -r 'pk.eyJ1' dist/assets || echo "Token prefix not found in dist/assets (grep exit code $?)"
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          
  release:
    name: Create Release
    needs: build
    runs-on: arc-runner-set-maps
    # Only run on main branch pushes, not PRs
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Create semantic-release config
        run: |
          cat > .releaserc.json << 'EOL'
          {
            "branches": ["main"],
            "plugins": [
              ["@semantic-release/commit-analyzer", {
                "preset": "angular",
                "releaseRules": [
                  {"type": "docs", "scope": "README", "release": "patch"},
                  {"type": "refactor", "release": "patch"},
                  {"type": "style", "release": "patch"},
                  {"type": "perf", "release": "patch"},
                  {"type": "build", "release": "patch"},
                  {"type": "ci", "release": "patch"},
                  {"type": "chore", "release": "patch"},
                  {"type": "test", "release": "patch"}
                ],
                "parserOpts": {
                  "noteKeywords": ["BREAKING CHANGE", "BREAKING CHANGES"]
                }
              }],
              ["@semantic-release/release-notes-generator", {
                "preset": "angular",
                "parserOpts": {
                  "noteKeywords": ["BREAKING CHANGE", "BREAKING CHANGES"]
                },
                "writerOpts": {
                  "commitsSort": ["subject", "scope"]
                }
              }],
              ["@semantic-release/npm", {
                "npmPublish": false
              }],
              ["@semantic-release/github", {
                "successComment": false,
                "failComment": false
              }],
              [
                "@semantic-release/git",
                {
                  "assets": ["package.json"],
                  "message": "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
                }
              ]
            ]
          }
          EOL
          
      - name: Debug config file
        run: |
          ls -la
          cat .releaserc.json
          
      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "GitHub Actions"
          GIT_AUTHOR_EMAIL: "actions@github.com"
          GIT_COMMITTER_NAME: "GitHub Actions"
          GIT_COMMITTER_EMAIL: "actions@github.com"
        run: |
          git config --global --add safe.directory /home/runner/_work/maps/maps
          git fetch --prune || true
          
          # Extract the most recent version from package.json
          CURRENT_VERSION=$(bun -e "console.log(require('./package.json').version)")
          echo "Current version from package.json: $CURRENT_VERSION"
          
          # Analyze commits to determine next version
          NEXT_VERSION=$(bunx semantic-release --dry-run | grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' || echo "")
          
          if [ -z "$NEXT_VERSION" ]; then
            echo "No release needed. Using current version: $CURRENT_VERSION"
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Next version will be: $NEXT_VERSION"
          
          # Update package.json
          bun -e "const pkg = require('./package.json'); pkg.version = '$NEXT_VERSION'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n')"
          
          # Create release notes
          NOTES=$(bunx semantic-release --dry-run | awk '/Release notes for version/{flag=1;next} /for version/{if(flag){exit}} flag' || echo "")
          
          # Create and force push git tag
          git add package.json
          git commit -m "chore(release): $NEXT_VERSION [skip ci]" || true
          git tag -f "v$NEXT_VERSION"
          git push origin "v$NEXT_VERSION" --force
          
          # Get the existing release ID
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v$NEXT_VERSION" | \
            grep -o '"id": [0-9]*' | head -1 | sed 's/"id": //')
          
          # Delete existing release if it exists
          if [ ! -z "$RELEASE_ID" ]; then
            echo "Deleting existing release with ID: $RELEASE_ID"
            curl -s -X DELETE \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          fi
          
          # Create GitHub release
          echo "Creating new release for v$NEXT_VERSION"
          RELEASE_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -d "{\"tag_name\":\"v$NEXT_VERSION\",\"name\":\"v$NEXT_VERSION\",\"body\":\"$NOTES\",\"draft\":false,\"prerelease\":false}")
          
          echo "Release creation response: $RELEASE_RESPONSE"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          
  # Separate job for Docker image building with multi-arch support
  docker:
    name: Build and Push Multi-Arch Docker Image
    needs: release
    runs-on: ubuntu-latest  
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: 'arm64,amd64'
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
          
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist
          
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Extract metadata for Docker
        id: metadata
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository_owner }}/maps
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
          
      - name: Convert repository owner to lowercase
        id: repo-name
        run: |
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_OWNER_LOWER=$REPO_OWNER_LOWER" >> $GITHUB_ENV
          echo "repo_owner_lower=$REPO_OWNER_LOWER" >> $GITHUB_OUTPUT
          
      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_OWNER_LOWER }}/maps:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_OWNER_LOWER }}/maps:buildcache,mode=max

  # Updated job for deploying infrastructure with Pulumi
  deploy:
    name: Deploy Infrastructure
    needs: [docker, release]
    runs-on: arc-runner-set-maps
    # Only run on main branch pushes, not PRs
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: main  # Ensure we're using the latest main branch with the version update
          fetch-depth: 1
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./infra
        run: npm install
        
      - name: Use version from release job
        run: |
          echo "VERSION=${{ needs.release.outputs.version }}" >> $GITHUB_ENV
          echo "Using version: ${{ needs.release.outputs.version }}"
          
      - name: Pulumi Refresh
        uses: pulumi/actions@v6
        with:
          command: refresh
          stack-name: prod
          work-dir: ./infra
          upsert: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          APP_VERSION: ${{ needs.release.outputs.version }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          
      - name: Pulumi Update
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: prod
          work-dir: ./infra
          upsert: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          APP_VERSION: ${{ needs.release.outputs.version }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          
      - name: Clean up old resources (if any)
        run: |
          echo "Deployment completed successfully. Old resources will be garbage collected by Pulumi."