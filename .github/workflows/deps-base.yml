name: Deps Base Image

on:
  push:
    branches: [main]
    paths:
      - bun.lock
      - package.json
      - apps/*/package.json
      - packages/*/package.json
      - docker/Dockerfile.deps
      - .github/workflows/deps-base.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-deps:
    runs-on: arc-routess
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute deps hash
        id: hash
        run: |
          DEPS_HASH=$(sha256sum bun.lock | cut -c1-12)
          echo "deps_hash=$DEPS_HASH" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if deps image exists
        id: check
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/routess-deps:${{ steps.hash.outputs.deps_hash }}"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push deps image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: docker/Dockerfile.deps
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/routess-deps:${{ steps.hash.outputs.deps_hash }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/routess-deps:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/routess-deps:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/routess-deps:cache,mode=max
