name: Feature request
description: Propose a new capability or improvement.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Focus on the **problem** first; we'll figure out the right solution together.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user need, not the feature. "I want X" is fine; "I need to do Y but can't because..." is better.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
      description: If you have one in mind, share it. If not, leave blank.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried or other approaches you ruled out.
  - type: dropdown
    id: surface
    attributes:
      label: Which part of routess?
      options:
        - Web app
        - API
        - CLI
        - Docs
        - Helm chart / self-host
        - Cross-cutting
    validations:
      required: true
