version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: maps-postgres
    environment:
      POSTGRES_DB: maps_db
      POSTGRES_USER: maps_user
      POSTGRES_PASSWORD: maps_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maps_user -d maps_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: maps-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://maps_user:maps_password@postgres:5432/maps_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules

volumes:
  postgres_data: 