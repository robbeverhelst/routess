codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        # basic
        target: 80%
        threshold: 5%
        paths:
          - "apps/api/src"
          - "apps/web/src"

      api:
        target: 80%
        threshold: 5%
        paths:
          - "apps/api/src"

      web:
        target: 70%
        threshold: 5%
        paths:
          - "apps/web/src"

    patch:
      default:
        # basic
        target: 80%
        threshold: 5%

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no

ignore:
  - "**/*.spec.ts"
  - "**/*.test.ts"
  - "**/test/**"
  - "**/tests/**"
  - "**/*.e2e-spec.ts"
  - "**/migrations/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/*.config.js"
  - "**/*.config.ts"
